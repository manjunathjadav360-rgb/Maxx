name: Deploy VYBE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "streamtube/index.html"
      - ".github/workflows/vybe-pages.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage existing homepage and VYBE
        run: |
          mkdir -p _site/streamtube
          cp index.html _site/index.html
          cp streamtube/index.html _site/streamtube/index.html
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
