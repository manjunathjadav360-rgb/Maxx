<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Enterprise Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #080b11; color: #fff; display: flex; justify-content: center; padding: 8px; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #101622; padding: 10px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 8px; border: 1px solid #1c2638; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #151d2c; padding: 7px 10px; border-radius: 8px; border: 1px solid #1f2b40; }
        .balance-title { font-size: 8px; color: #7a8b9e; font-weight: bold; }
        .balance { color: #2ecc71; font-weight: bold; font-size: 14px; }
        .history-bar { display: flex; gap: 5px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; align-items: center; }
        .history-bar::-webkit-scrollbar { display: none; }
        .history-item { background: #182233; border: 1px solid #28364f; padding: 3px 7px; border-radius: 10px; font-size: 9px; font-weight: bold; white-space: nowrap; color: #2ecc71; }
        .history-item.high { color: #f39c12; border-color: #f39c1255; }
        .history-item.low { color: #7a8b9e; }
        .game-screen { height: 200px; background: #0a0e17; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; border: 1px solid #1f2b40; overflow: hidden; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .center-hud { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        #multiplier { font-size: 38px; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
        #status { font-size: 10px; color: #7a8b9e; margin-top: 2px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .controls { display: flex; flex-direction: column; gap: 6px; }
        .bet-panel { display: flex; flex-direction: column; background: #151d2c; border-radius: 8px; border: 1px solid #1f2b40; padding: 8px; gap: 6px; }
        .bet-tabs { display: flex; background: #0e1420; border-radius: 5px; padding: 2px; width: fit-content; gap: 2px; margin-bottom: 2px; }
        .tab-btn { background: transparent; border: none; color: #7a8b9e; font-size: 8px; font-weight: bold; padding: 3px 8px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { background: #1f2b40; color: #fff; }
        .bet-main-row { display: flex; gap: 8px; }
        .bet-left { display: flex; flex-direction: column; gap: 4px; width: 50%; }
        .bet-right { display: flex; flex-direction: column; gap: 4px; width: 50%; justify-content: center; }
        .input-group { display: flex; flex-direction: column; gap: 2px; }
        label { font-size: 8px; color: #7a8b9e; font-weight: 700; text-transform: uppercase; }
        .stake-input-wrapper { display: flex; align-items: center; background: #0a0e17; border: 1px solid #28364f; border-radius: 6px; overflow: hidden; }
        .stake-btn-ctrl { background: #1f2b40; color: #fff; border: none; padding: 4px 7px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .stake-btn-ctrl:hover { background: #2a3a54; }
        input[type="number"] { background: transparent; color: #fff; border: none; padding: 3px; font-size: 11px; width: 100%; font-weight: bold; text-align: center; outline: none; }
        .quick-chips { display: flex; gap: 3px; }
        .chip { background: #1f2b40; color: #a4b5cd; border: none; padding: 2px 0; font-size: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; }
        .chip:hover { background: #2a3a54; color: #fff; }
        button.action-btn { padding: 10px 6px; font-size: 12px; font-weight: 900; border-radius: 6px; border: none; cursor: pointer; width: 100%; transition: 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
        .bet-btn-cls { background: #2ecc71; color: #080b11; }
        .bet-btn-cls:hover { background: #27ae60; }
        .bet-btn-cls:disabled { background: #151d2c; color: #48576d; cursor: not-allowed; }
        .cashout-btn-cls { background: #f39c12; color: #080b11; display: none; }
        .cashout-btn-cls:hover { background: #d68910; }
        .auto-row { display: flex; align-items: center; gap: 4px; font-size: 8px; color: #7a8b9e; }
        .auto-row input[type="checkbox"] { accent-color: #2ecc71; cursor: pointer; }
        .auto-row input[type="number"] { width: 38px; background: #0a0e17; border: 1px solid #28364f; color: #fff; font-size: 8px; text-align: center; border-radius: 4px; padding: 2px; }
        .chat-container { background: #151d2c; border-radius: 8px; border: 1px solid #1f2b40; padding: 6px; display: flex; flex-direction: column; gap: 4px; font-size: 9px; }
        .chat-messages { height: 50px; overflow-y: auto; background: #0a0e17; border-radius: 4px; padding: 4px; border: 1px solid #1f2b40; display: flex; flex-direction: column; gap: 2px; }
        .chat-msg { color: #a4b5cd; }
        .chat-msg span { color: #3498db; font-weight: bold; }
        .chat-input-row { display: flex; gap: 4px; }
        .chat-input { flex: 1; background: #0a0e17; border: 1px solid #28364f; border-radius: 4px; padding: 3px 6px; color: #fff; font-size: 9px; outline: none; }
        .chat-send { background: #1f2b40; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 9px; cursor: pointer; font-weight: bold; }
        .logs { background: #0a0e17; padding: 4px 8px; border-radius: 6px; height: 35px; overflow-y: auto; font-family: monospace; font-size: 8px; color: #2ecc71; border: 1px solid #1f2b40; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="history-bar" id="historyBar">
                <div class="history-item low">1.20x</div>
                <div class="history-item">2.45x</div>
                <div class="history-item high">14.20x</div>
            </div>
            <div style="display: flex; gap: 4px; align-items: center;">
                <button onclick="toggleAudio()" id="audioBtn" style="background: #1f2b40; color: #fff; border: 1px solid #28364f; padding: 3px 6px; font-size: 8px; border-radius: 6px; cursor: pointer;">🔊 Audio</button>
                <button onclick="addBonus()" style="background: #1f2b40; color: #2ecc71; border: 1px solid #2ecc7155; padding: 3px 6px; font-size: 8px; border-radius: 6px; cursor: pointer; font-weight: bold;">+₹1000</button>
            </div>
        </div>
        <div class="top-bar" style="padding: 5px 10px;">
            <span style="font-size: 9px; font-weight: bold; color: #fff;">🚀 ENTERPRISE AVIATOR PRO</span>
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <div class="balance-title">BALANCE</div>
                <div class="balance">₹<span id="balance">10000.00</span></div>
            </div>
        </div>
        <div class="game-screen" id="screen">
            <canvas id="gameCanvas"></canvas>
            <div class="center-hud">
                <div id="multiplier">1.00x</div>
                <div id="status">Next flight starting...</div>
            </div>
        </div>
        <div class="controls">
            <div class="bet-panel">
                <div class="bet-tabs">
                    <button class="tab-btn active" id="tabManual" onclick="switchTab('manual')">Manual Bet</button>
                    <button class="tab-btn" id="tabAuto" onclick="switchTab('auto')">Auto Play</button>
                </div>
                <div class="bet-main-row">
                    <div class="bet-left">
                        <div class="input-group">
                            <label>Bet Amount</label>
                            <div class="stake-input-wrapper">
                                <button class="stake-btn-ctrl" onclick="adjustStake(-50)">-</button>
                                <input type="number" id="stake" value="100" min="10">
                                <button class="stake-btn-ctrl" onclick="adjustStake(50)">+</button>
                            </div>
                        </div>
                        <div class="quick-chips">
                            <button class="chip" onclick="setStake(50)">50</button>
                            <button class="chip" onclick="setStake(100)">100</button>
                            <button class="chip" onclick="setStake(500)">500</button>
                        </div>
                        <div class="auto-row">
                            <input type="checkbox" id="autoCash"> Cashout @
                            <input type="number" id="autoVal" value="2.00" step="0.1" min="1.1">x
                        </div>
                    </div>
                    <div class="bet-right">
                        <button id="betBtn" class="action-btn bet-btn-cls" onclick="handleMainAction()">BET</button>
                        <button id="cashoutBtn" class="action-btn cashout-btn-cls" onclick="cashOut()">CASHOUT<br><span id="cashoutVal" style="font-size: 8px;">₹0.00</span></button>
                    </div>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <div style="font-weight: bold; color: #7a8b9e; display: flex; justify-content: space-between;">
                <span>💬 Live Room Chat</span> <span style="color:#2ecc71;">Online: 1,420</span>
            </div>
            <div class="chat-messages" id="chatBox">
                <div class="chat-msg"><span>KingRocket:</span> Let's hit 10x this round! 🚀</div>
                <div class="chat-msg"><span>LuckyGirl:</span> Cashed out safe at 2.2x ✨</div>
                <div class="chat-msg"><span>AviatorPro:</span> Clean graph sequence.</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." onkeypress="handleChatKey(event)">
                <button class="chat-send" onclick="sendChatMessage()">Send</button>
            </div>
        </div>
        <div class="logs" id="logs">> Enterprise session initialized successfully.<br></div>
    </div>

    <script>
        let audioEnabled = true;
        let audioCtx = null;
        let isAutoPlay = false;
        let autoPlayRoundsLeft = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audioBtn').innerText = audioEnabled ? '🔊 Audio' : '🔇 Muted';
        }
        function playBeep(freq = 440, duration = 0.04) {
            if (!audioEnabled) return;
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        function playCashoutSound() {
            if (!audioEnabled) return;
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.setValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.25);
            } catch(e) {}
        }
        function playExplosionSound() {
            if (!audioEnabled) return;
            try {
                initAudio();
                let bufferSize = audioCtx.sampleRate * 0.3;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 450;
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                noise.connect(filter); filter.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        let balance = 10000.00;
        let gameState = 'WAITING';
        let multiplier = 1.00;
        let crashPoint = 1.00;
        let animationFrameId = null;
        let startTime = 0;
        let historyData = [1.20, 2.45, 14.20];
        let betActive = false;
        let currentBetAmount = 0;

        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const statusEl = document.getElementById('status');
        const historyBar = document.getElementById('historyBar');
        const logsEl = document.getElementById('logs');
        const chatBox = document.getElementById('chatBox');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function log(text) {
            logsEl.innerHTML += `> ${text}<br>`;
            logsEl.scrollTop = logsEl.scrollHeight;
        }
        function sendChatMessage() {
            let input = document.getElementById('chatInput');
            let text = input.value.trim();
            if (!text) return;
            chatBox.innerHTML += `<div class="chat-msg"><span>You:</span> ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function handleChatKey(e) {
            if (e.key === 'Enter') sendChatMessage();
        }
        function switchTab(mode) {
            document.getElementById('tabManual').className = `tab-btn ${mode === 'manual' ? 'active' : ''}`;
            document.getElementById('tabAuto').className = `tab-btn ${mode === 'auto' ? 'active' : ''}`;
            isAutoPlay = (mode === 'auto');
        }
        function updateUI() {
            balanceEl.innerText = balance.toFixed(2);
            if (betActive) {
                let pot = (currentBetAmount * multiplier).toFixed(2);
                document.getElementById('cashoutVal').innerText = `₹${pot}`;
            }
        }
        function updateHistoryUI() {
            historyBar.innerHTML = '';
            historyData.slice(-6).reverse().forEach(val => {
                let item = document.createElement('div');
                item.className = `history-item ${val > 5 ? 'high' : (val < 1.5 ? 'low' : '')}`;
                item.innerText = val.toFixed(2) + 'x';
                historyBar.appendChild(item);
            });
        }
        function setStake(val) { document.getElementById('stake').value = val; }
        function adjustStake(amount) {
            let input = document.getElementById('stake');
            let val = parseInt(input.value) + amount;
            if (val >= 10) input.value = val;
        }
        function addBonus() { balance += 1000; updateUI(); log("Added ₹1000 bonus credits."); }

        function drawScene(progress, isCrashed = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameState === 'WAITING') return;
            let w = canvas.width, h = canvas.height;
            ctx.strokeStyle = '#151d2c'; ctx.lineWidth = 1;
            for (let x = 0; x < w; x += 25) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let y = 0; y < h; y += 25) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
            let startX = 0, startY = h;
            let controlX = w * 0.6, controlY = h * 0.8;
            let rocketX = w * 0.1 + progress * w * 0.75;
            let rocketY = h * 0.95 - Math.pow(progress, 1.4) * h * 0.75;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(controlX, controlY, rocketX, rocketY);
            ctx.lineTo(rocketX, h); ctx.lineTo(startX, h);
            ctx.closePath();
            ctx.fillStyle = isCrashed ? 'rgba(231, 76, 60, 0.08)' : 'rgba(46, 204, 113, 0.08)';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(controlX, controlY, rocketX, rocketY);
            ctx.strokeStyle = isCrashed ? '#e74c3c' : '#2ecc71';
            ctx.lineWidth = 3; ctx.stroke();
            ctx.save(); ctx.translate(rocketX, rocketY);
            if (!isCrashed) {
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-6, 6); ctx.lineTo(6, 6); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(-4, -8); ctx.lineTo(4, -8); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(0, 10, 4, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function startWaitingCountdown() {
            gameState = 'WAITING';
            multiplier = 1.00;
            multiplierEl.innerText = '1.00x';
            multiplierEl.style.color = '#fff';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let countdown = 4;
            statusEl.innerText = `Next flight in ${countdown}s`;
            if (!betActive) {
                let bBtn = document.getElementById('betBtn');
                bBtn.style.display = 'block';
                bBtn.disabled = false;
            }
            document.getElementById('cashoutBtn').style.display = 'none';
            if (isAutoPlay && !betActive && balance >= parseFloat(document.getElementById('stake').value)) {
                placeBet();
            }
            let timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    playBeep(250, 0.04);
                    statusEl.innerText = `Next flight in ${countdown}s`;
                } else {
                    clearInterval(timer);
                    playBeep(550, 0.1);
                    startLaunch();
                }
            }, 1000);
        }

        function startLaunch() {
            gameState = 'RUNNING';
            statusEl.innerText = 'Fly away...';
            let rand = Math.random();
            crashPoint = rand < 0.04 ? 1.00 : parseFloat((Math.max(1.01, 0.98 / (1 - Math.random() * 0.95))).toFixed(2));
            startTime = performance.now();
            function updateLaunch(currentTime) {
                if (gameState !== 'RUNNING') return;
                let elapsed = (currentTime - startTime) / 1000;
                multiplier = parseFloat((1.00 + elapsed * 0.32).toFixed(2));
                if (multiplier < crashPoint) {
                    multiplierEl.innerText = multiplier.toFixed(2) + 'x';
                    let progress = Math.min(1.0, elapsed * 0.1);
                    drawScene(progress, false);
                    updateUI();
                    if (betActive && document.getElementById('autoCash').checked) {
                        let target = parseFloat(document.getElementById('autoVal').value);
                        if (multiplier >= target) executeCashOut();
                    }
                    animationFrameId = requestAnimationFrame(updateLaunch);
                } else {
                    multiplier = crashPoint;
                    multiplierEl.innerText = multiplier.toFixed(2) + 'x';
                    triggerExplosion();
                }
            }
            animationFrameId = requestAnimationFrame(updateLaunch);
        }

        function triggerExplosion() {
            gameState = 'CRASHED';
            cancelAnimationFrame(animationFrameId);
            playExplosionSound();
            multiplierEl.innerText = crashPoint.toFixed(2) + 'x';
            multiplierEl.style.color = '#e74c3c';
            statusEl.innerText = 'FLEW AWAY!';
            drawScene(1.0, true);
            historyData.push(crashPoint);
            updateHistoryUI();
            if (betActive) {
                log(`Lost ₹${currentBetAmount}! Flew away at ${crashPoint.toFixed(2)}x`);
                betActive = false;
            }
            let bBtn = document.getElementById('betBtn');
            bBtn.style.display = 'block';
            bBtn.disabled = true;
            document.getElementById('cashoutBtn').style.display = 'none';
            setTimeout(startWaitingCountdown, 3500);
        }

        function handleMainAction() {
            if (gameState === 'WAITING') placeBet();
        }
        function placeBet() {
            initAudio();
            let amount = parseFloat(document.getElementById('stake').value);
            if (isNaN(amount) || amount <= 0 || amount > balance) return log(`Invalid stake or low balance.`);
            currentBetAmount = amount;
            betActive = true;
            balance -= currentBetAmount;
            updateUI();
            playBeep(450, 0.06);
            log(`Placed bet: ₹${currentBetAmount}`);
            document.getElementById('betBtn').style.display = 'none';
            let cBtn = document.getElementById('cashoutBtn');
            cBtn.style.display = 'flex';
            cBtn.style.flexDirection = 'column';
        }
        function cashOut() {
            if (gameState !== 'RUNNING' || !betActive) return;
            executeCashOut();
        }
        function executeCashOut() {
            let winnings = parseFloat((currentBetAmount * multiplier).toFixed(2));
            balance += winnings;
            updateUI();
            playCashoutSound();
            log(`Cashed out at ${multiplier.toFixed(2)}x! Won ₹${winnings}`);
            betActive = false;
            document.getElementById('cashoutBtn').style.display = 'none';
            let bBtn = document.getElementById('betBtn');
            bBtn.style.display = 'block';
            bBtn.disabled = true;
        }

        updateHistoryUI();
        startWaitingCountdown();
    </script>
</body>
</html>
