name: Deploy ResolveLoop demo

on:
  workflow_dispatch:
  push:
    paths:
      - "resolveloop/**"
      - ".github/workflows/deploy-resolveloop.yml"
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ResolveLoop site
        uses: actions/upload-pages-artifact@v3
        with:
          path: resolveloop

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
